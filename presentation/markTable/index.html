<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../../css/common.css">
    <link rel="stylesheet" href="../../css/markTable.css">
    <title>Mark table</title>
  </head>

  <body>
    <table id="markTable">
      <thead>
        <tr>
          <th></th>
          <th>First Name <span class="required">*</span> </th>
          <th>Last Name <span class="required">*</span> </th>
          <th>Date of birth <span class="required">*</span> </th>
          <th>Mark</th>
          <th>Coe</th>
          <th>Sum</th>
          <th>
            <button type="button" id="addRowButton">Add Row</button>
          </th>
        </tr>
      </thead>
      <tbody id="inputRows"></tbody>
      <tfoot>
        <tr id="totalRow">
          <td colspan="6" style="text-align:right">Total</td>
          <td id="total">0</td>
          <td></td>
        </tr>
      </tfoot>
    </table>

    <div class="save-container">
      <button type="button" id="saveButton">Save</button>
    </div>

    <div id="output"></div>
    <table id="outputTable">
      <thead>
        <tr>
          <th colspan="6" id="outputHeader">Output</th>
        </tr>
        <tr>
          <th>First Name</th>
          <th>Last Name</th>
          <th>Date of birth</th>
          <th>Mark</th>
          <th>Coe</th>
          <th>Sum</th>
        </tr>
      </thead>
      <tbody id="outputRows"></tbody>
      <tfoot>
        <tr id="totalRow">
          <td colspan="5" style="text-align:right">Total</td>
          <td id="outputTotal">0</td>
        </tr>
      </tfoot>
    </table>

    <script type="module" src="./markTableController.js"></script>

  </body>
</html>
